name: Ping check-distribution every 10 minutes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: cURL check-distribution
        run: |
          if [ -z "${{ secrets.CHECK_DISTRIBUTION_URL }}" ]; then
            echo "Missing secret CHECK_DISTRIBUTION_URL" >&2
            exit 1
          fi
          echo "Hitting ${{ secrets.CHECK_DISTRIBUTION_URL }}"
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" "${{ secrets.CHECK_DISTRIBUTION_URL }}")
          echo "Status: $HTTP_STATUS"
          echo "Response:" && cat response.txt
          if [ "$HTTP_STATUS" -ge 400 ]; then
            exit 1
          fi
